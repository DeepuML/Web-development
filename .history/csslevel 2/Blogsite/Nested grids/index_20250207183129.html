<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Grid</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div id="header" class="box">Header</div>
        <div id="sidebar" class="box">Sidebar</div>
        <div id="content" class="box">Main Content
            <div class="childgrid">
                <div class="element">Image 1</div>
                <div class="element">Image 2</div>
                <div class="element">Image 3</div>
                <div class="element">Image 4</div>
            </div>
        </div>
        <div id="footer" class="box">Footer</div>
    </div>
</body> 
</html>
