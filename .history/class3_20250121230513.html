<html>
    <title>Practice Table</title>
    <style>
        table,tr,td,th{
            border:1px solid black;
            border-collapse:collapse;
            text-align: center;
        }
    </style>
    <table>
        <colgroup>
        <col span="1" style="background-color: green">
        <col span="1" style="background-color: pink">
        <col span="1" style="background-color:burlywood">
        </colgroup>
        <tr>
            <td rowspan="2">State of Helath</td>
            <td colspan="2">Fasting Value</td>
            <td>After Eating</td>
        </tr>
        <tr>
            <td>Minimum</td>
            <td>Maximum</td>
            <td>2 ht after eating</td>
        </tr>
        <tr>
            <td>Healthy</td>
            <td>70</td>
            <td>100</td>
            <td>less than 140</td>
        </tr>
        <tr>
            <td>Pre diabetic</td>
            <td>101</td>
            <td>126</td>
            <td>140 to 200</td>
        </tr>
        <tr>
            <td>Diabetes</td>
            <td>More than 126</td>
            <td>NA</td>
            <td>More than 200</td>
        </tr>
    </table>
</html>
